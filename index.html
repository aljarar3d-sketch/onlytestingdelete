<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR API Tester</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 20px;
    }

    model-viewer {
      width: 90%;
      max-width: 800px;
      height: 500px;
      background: #1e1e1e;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    #ar-button {
      background-color: #ff4757;
      color: white;
      border-radius: 8px;
      border: none;
      padding: 15px 30px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 999;
      display: flex !important;
    }

    .list {
      width: 90%;
      max-width: 800px;
    }

    .item {
      background: #1e1e1e;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .item:hover {
      background: #333;
    }
  </style>
</head>

<body>

<h2>📱 AR Models from API</h2>

<model-viewer 
  id="viewer"
  src=""
  ios-src=""
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1">

  <button slot="ar-button" id="ar-button">
    🚀 VIEW IN YOUR SPACE
  </button>

  <div slot="poster" style="color:white;">
    Loading model...
  </div>

</model-viewer>

<div class="list" id="modelsList">
  Loading models...
</div>

<script>
const CLIENT_SLUG = 'alaa';
const API_KEY = 'fd08c7d3-ec11-4624-b703-e6f5e3f2101a';

async function loadModels() {
  try {
    const response = await fetch(
      `https://aljar-api.onrender.com/api/clients/public/${CLIENT_SLUG}`,
      {
        method: 'GET',
        headers: {
          'x-api-key': API_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    console.log("DATA:", data);

    const list = document.getElementById("modelsList");
    list.innerHTML = "";

    let firstLoaded = false;

    data.categories.forEach(category => {
      category.assets.forEach(asset => {

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<b>${category.name}</b> → ${asset.name}`;

        div.onclick = () => {
          loadModel(asset.glb_url, asset.usdz_url);
        };

        list.appendChild(div);

        // ✅ AUTO LOAD FIRST MODEL
        if (!firstLoaded) {
          loadModel(asset.glb_url, asset.usdz_url);
          firstLoaded = true;
        }
      });
    });

  } catch (err) {
    console.error("ERROR:", err);
    document.getElementById("modelsList").innerText = "❌ " + err.message;
  }
}

function loadModel(glb, usdz) {
  const viewer = document.getElementById("viewer");
  
  // We append the API Key so the Vault allows the download
  const authenticatedGlb = `${glb}?key=${API_KEY}`;
  const authenticatedUsdz = `${usdz}?key=${API_KEY}`;

  console.log("Loading Authenticated Model:", authenticatedGlb);

  viewer.src = authenticatedGlb;
  viewer.setAttribute("ios-src", authenticatedUsdz);
}

// 🔥 DEBUG MODEL LOADING
const viewer = document.getElementById("viewer");

viewer.addEventListener("load", () => {
  console.log("✅ MODEL LOADED SUCCESSFULLY");
});

viewer.addEventListener("error", (e) => {
  console.error("❌ MODEL FAILED TO LOAD:", e);
});

// Start
loadModels();
</script>

</body>
</html>
