<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aljar API Pipeline Tester</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #181818;
            --primary: #ff4757;
            --success: #2ecc71;
            --text: #ffffff;
            --muted: #666;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid #222; 
            max-width: 450px; 
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-weight: 800; letter-spacing: -0.5px; }
        
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            padding: 10px;
            background: #111;
            border-radius: 10px;
        }

        .dot { height: 8px; width: 8px; background: var(--success); border-radius: 50%; }

        .category-title { 
            color: var(--muted); 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 30px; 
            border-bottom: 1px solid #222; 
            padding-bottom: 8px; 
            font-weight: bold;
        }

        .asset-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #1a1a1a;
        }

        .asset-item:last-child { border-bottom: none; }

        .asset-name { font-weight: 500; font-size: 1rem; }

        .ar-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .ar-btn:hover { 
            background: #ff6b81; 
            transform: scale(1.05); 
        }

        .ar-btn:active { transform: scale(0.95); }

        #loader { text-align: center; color: var(--muted); padding: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👟 Aljar Pipeline</h2>
        
        <div class="status-bar">
            <div class="dot"></div>
            <span>Vault: <strong id="client-name">Connecting...</strong></span>
        </div>

        <div id="assets-container">
            <div id="loader">Scanning Aljar-API for 3D Assets...</div>
        </div>
    </div>

    <script>
        // --- ⚙️ CONFIGURATION ---
        const CLIENT_SLUG = 'alaa'; 
        const API_KEY = 'fd08c7d3-ec11-4624-b703-e6f5e3f2101a'; 
        const BASE_URL = 'https://aljar-api.onrender.com';

        async function initPipeline() {
            const container = document.getElementById('assets-container');
            
            try {
                // 1. Fetch Client Structure
                const response = await fetch(`${BASE_URL}/api/clients/public/${CLIENT_SLUG}`, {
                    method: 'GET',
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) throw new Error("Vault Access Denied (Check API Key)");

                const data = await response.json();
                document.getElementById('client-name').innerText = data.client;
                container.innerHTML = ''; // Clear loader

                // 2. Loop through Categories
                data.categories.forEach(cat => {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-title';
                    catHeader.innerText = cat.name;
                    container.appendChild(catHeader);

                    // 3. Loop through Assets
                    cat.assets.forEach(asset => {
                        const item = document.createElement('div');
                        item.className = 'asset-item';
                        item.innerHTML = `
                            <span class="asset-name">${asset.name}</span>
                            <button class="ar-btn" onclick="launchAR('${asset.glb_url}', '${asset.usdz_url}', '${asset.name}')">
                                VIEW IN AR
                            </button>
                        `;
                        container.appendChild(item);
                    });
                });

                if (data.categories.length === 0) {
                    container.innerHTML = '<p style="color: #444; text-align: center;">This vault is currently empty.</p>';
                }

            } catch (err) {
                console.error("Pipeline Error:", err);
                container.innerHTML = `<p style="color: #ff4757; text-align: center; padding: 20px; background: #221111; border-radius: 10px;">
                    <strong>Pipeline Error:</strong><br>${err.message}
                </p>`;
            }
        }

        /**
         * The Core AR Engine
         * Authenticates the URLs for external AR apps (Scene Viewer/Quick Look)
         */
        function launchAR(glb, usdz, name) {
            // Append the API Key so the Secure Vault allows the download
            const authenticatedGLB = `${glb}?key=${API_KEY}`;
            const authenticatedUSDZ = `${usdz}?key=${API_KEY}`;

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isIOS) {
                // --- iOS Quick Look Implementation ---
                const a = document.createElement('a');
                a.setAttribute('rel', 'ar');
                a.setAttribute('href', authenticatedUSDZ);
                
                // iOS requires an img child for the link to be clickable as an AR object
                const img = document.createElement('img');
                img.setAttribute('src', 'https://developer.apple.com/assets/elements/icons/augmented-reality/augmented-reality-64x64_2x.png');
                img.setAttribute('style', 'display:none');
                
                a.appendChild(img);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                // --- Android Scene Viewer Implementation ---
                // We MUST encode the authenticated URL because it contains a '?' 
                const encodedUrl = encodeURIComponent(authenticatedGLB);
                const sceneViewerUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodedUrl}&mode=ar_only&title=${encodeURIComponent(name)}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;`;
                
                window.location.href = sceneViewerUrl;
            }
        }

        // Initialize the test on page load
        initPipeline();
    </script>
</body>
</html>
