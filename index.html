<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR API Tester</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 20px;
    }

    model-viewer {
      width: 90%;
      max-width: 800px;
      height: 500px;
      background: #1e1e1e;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    #ar-button {
      background-color: #ff4757;
      color: white;
      border-radius: 8px;
      border: none;
      padding: 15px 30px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 999;
      display: flex !important;
    }

    .list {
      width: 90%;
      max-width: 800px;
    }

    .item {
      background: #1e1e1e;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .item:hover {
      background: #333;
    }
  </style>
</head>

<body>

<h2>📱 AR Models from API</h2>

<model-viewer 
  id="viewer"
  src=""
  ios-src=""
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate>

  <button slot="ar-button" id="ar-button">
    🚀 VIEW IN YOUR SPACE
  </button>

</model-viewer>

<div class="list" id="modelsList">
  Loading models...
</div>

<script>
const API_URL = "https://aljar-api.onrender.com/api/clients/public/alaa?key=fd08c7d3-ec11-4624-b703-e6f5e3f2101a"; // <-- your endpoint

async function loadModels() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const list = document.getElementById("modelsList");
    list.innerHTML = "";

    data.categories.forEach(category => {
      category.assets.forEach(asset => {

        const div = document.createElement("div");
        div.className = "item";
        div.innerText = `${category.name} → ${asset.name}`;

        div.onclick = () => {
          loadModel(asset.glb_url, asset.usdz_url);
        };

        list.appendChild(div);
      });
    });

  } catch (err) {
    console.error(err);
    document.getElementById("modelsList").innerText = "❌ Failed to load API";
  }
}

function loadModel(glb, usdz) {
  const viewer = document.getElementById("viewer");

  viewer.src = glb;
  viewer.setAttribute("ios-src", usdz);

  console.log("Loaded:", glb);
}

// Load on start
loadModels();
</script>

</body>
</html>
