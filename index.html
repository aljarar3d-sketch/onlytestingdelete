<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aljar AR Viewer</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h2 { margin: 20px 0 10px 0; font-weight: 300; letter-spacing: 1px; text-align: center;}

    model-viewer {
      width: 95%;
      max-width: 800px;
      height: 60vh;
      background: radial-gradient(circle, #2c2c2c 0%, #121212 100%);
      border-radius: 24px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Standard AR button (for list clicking) */
    #ar-button {
      background: #ff4757;
      color: white;
      border-radius: 30px;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      z-index: 2;
    }

    .list { width: 95%; max-width: 800px; padding-bottom: 40px; }

    .item {
      background: #1e1e1e;
      padding: 15px;
      margin: 10px 0;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, background 0.2s;
      border: 1px solid #333;
    }

    .item:hover { background: #252525; transform: translateY(-2px); }

    .item-info { flex-grow: 1; cursor: pointer; }
    .item-info b { display: block; color: #ff4757; font-size: 12px; text-transform: uppercase; }
    .item-info span { font-size: 16px; color: #eee; }

    .qr-thumb {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 8px;
      padding: 4px;
      cursor: zoom-in;
    }

    /* --- 🆕 Styles for the QR Scan Experience --- */
    
    /* Fullscreen Overlay to trigger AR gesture */
    #ar-scan-overlay {
      display: none; /* Hidden by default, shown only on scan */
      position: fixed;
      inset: 0;
      background: #0f0f0f; /* Match body bg */
      z-index: 1000; /* Over everything */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #ar-scan-overlay.visible {
      display: flex;
    }

    #scan-model-viewer {
      width: 100%;
      height: 50vh; /* Model takes top half */
      background: transparent;
      margin-bottom: 20px;
    }

    .scan-info {
      padding: 0 30px;
      margin-bottom: 40px;
    }

    .scan-info b { font-size: 12px; color: #ff4757; text-transform: uppercase;}
    .scan-info h1 { font-size: 32px; margin: 5px 0 10px 0; color: white; font-weight: bold;}
    .scan-info p { color: #aaa; margin: 0; font-size: 16px;}

    .big-ar-button {
      background: #ff4757;
      color: white;
      padding: 20px 40px;
      border-radius: 50px;
      border: none;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255,71,87,0.6);
      transition: transform 0.1s;
    }

    .big-ar-button:active { transform: scale(0.95); }
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
  }

  .pulse-animation {
    animation: pulse 1.5s infinite;
  }

  .big-ar-button:disabled {
    background: #444;
    cursor: not-allowed;
    box-shadow: none;
  }
  </style>
</head>

<body>

<div id="standard-view">
  <h2>ALJAR MEOW <span style="color:#ff4757">VAULT</span></h2>

  <model-viewer 
    id="viewer"
    src=""
    ios-src=""
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1.2">

    <button slot="ar-button" id="ar-button">
      <span>👋</span> VIEW IN YOUR SPACE
    </button>

    <div slot="poster" style="display:flex; justify-content:center; align-items:center; height:100%;">
      <p>Select a model to begin...</p>
    </div>
  </model-viewer>

  <div class="list" id="modelsList">
    <p style="text-align:center; color:#666;">Synchronizing with Aljar Cloud...</p>
  </div>
</div>


<div id="ar-scan-overlay">
  <model-viewer 
    id="scan-model-viewer" 
    src="" 
    ios-src="" 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls 
    auto-rotate 
    interaction-prompt="none"
    environment-image="neutral">
  </model-viewer>

  <div class="scan-info">
    <b id="scan-cat-name">CATEGORY</b>
    <h1 id="scan-asset-name">Product Name</h1>
    <p>Object is ready. Tap below to launch your camera.</p>
  </div>

  <button class="big-ar-button" onclick="launchCamera()">
    📸 OPEN CAMERA
  </button>
</div>


<script>

// --- ⚙️ CONFIGURATION ---
const urlParams = new URLSearchParams(window.location.search);
const CLIENT_SLUG = urlParams.get('client') || 'alaa';
const TARGET_ASSET = urlParams.get('asset'); 
const API_KEY = 'fd08c7d3-ec11-4624-b703-e6f5e3f2101a';

const scanOverlay = document.getElementById('ar-scan-overlay');
const standardView = document.getElementById('standard-view');

async function loadModels() {
  try {
    const response = await fetch(
      `https://aljar-api.onrender.com/api/clients/public/${CLIENT_SLUG}`,
      { headers: { 'x-api-key': API_KEY } }
    );
    const data = await response.json();
    const list = document.getElementById("modelsList");
    list.innerHTML = "";

    if (TARGET_ASSET) {
      let found = false;
      data.categories.forEach(category => {
        category.assets.forEach(asset => {
          if (asset.slug === TARGET_ASSET) {
            found = true;
            setupScanExperience(asset, category.name);
          }
        });
      });
      if (!found) {
        document.body.innerHTML = "<h2 style='color:red; margin-top:50px;'>❌ Asset Not Found</h2>";
      }
      return; 
    }

    // Standard List logic
    let firstLoaded = false;
    data.categories.forEach(category => {
      category.assets.forEach(asset => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="item-info"><b>${category.name}</b><span>${asset.name}</span></div>
          ${asset.qr_code_url ? `<img src="${asset.qr_code_url}" class="qr-thumb">` : `<div class="no-qr">No QR</div>`}
        `;
        div.querySelector('.item-info').onclick = () => loadModel(asset.glb_url, asset.usdz_url, true);
        list.appendChild(div);
        if (!firstLoaded) { loadModel(asset.glb_url, asset.usdz_url, false); firstLoaded = true; }
      });
    });
  } catch (err) { console.error(err); }
}

function loadModel(glb, usdz, shouldActivateAR) {
  const viewer = document.getElementById("viewer");
  viewer.src = glb;
  viewer.setAttribute("ios-src", usdz);
  if (shouldActivateAR) {
    viewer.addEventListener('load', () => viewer.activateAR(), { once: true });
  }
}

// --- 🆕 QR SCAN AUTO-CAMERA LOGIC ---
function setupScanExperience(asset, categoryName) {
  standardView.style.display = 'none';
  scanOverlay.classList.add('visible');

  document.getElementById('scan-cat-name').innerText = categoryName;
  document.getElementById('scan-asset-name').innerText = asset.name;

  const scanViewer = document.getElementById('scan-model-viewer');
  const btn = document.querySelector('.big-ar-button');

  // Set loading state
  btn.innerText = "⏳ PREPARING 3D OBJECT...";
  btn.disabled = true;
  btn.style.opacity = "0.5";

  // Load the model
  scanViewer.src = asset.glb_url;
  scanViewer.setAttribute("ios-src", asset.usdz_url);

  // When model is ready, enable button & pulse
  scanViewer.addEventListener('load', () => {
    btn.innerText = "📸 OPEN CAMERA NOW";
    btn.disabled = false;
    btn.classList.add('pulse-ready');
  });

  // If loading fails (Vault Proxy Error)
  scanViewer.addEventListener('error', () => {
    btn.innerText = "❌ ACCESS DENIED";
    btn.style.background = "#000";
  });
}

function launchCamera() {
  const scanViewer = document.getElementById('scan-model-viewer');
  scanViewer.activateAR();
}

loadModels();
</script>

</body>
</html>
